{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center">
  <div class="container p-4" style="max-width: 420px; background:#6699A1; border-radius:10px;">
    <h2 class="text-white text-center mb-3">Login</h2>

    {% if msg %}
      <div class="text-white fw-bold mb-2">{{ msg }}</div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="post">
      <input class="form-control mb-3" type="text" name="username" placeholder="Enter Username" required>
      <input class="form-control mb-3" type="password" name="password" placeholder="Enter Password" required>
      <button class="btn btn-dark w-100" type="submit">Login</button>
    </form>

    <p class="text-center mt-3 mb-0">
      <span class="text-white">Don't have an account?</span>
      <a class="fw-bold" href="{{ url_for('register') }}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
