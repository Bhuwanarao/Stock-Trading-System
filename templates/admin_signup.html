{% extends "base.html" %}
{% block title %}Admin Sign Up · MY401{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Create Admin</h1>
        <form method="post" action="{{ url_for('admin_register') }}">
          <div class="mb-3">
            <label class="form-label">Admin Key</label>
            <input class="form-control" name="admin_key" required>
            <div class="form-text">Ask your lead/instructor for the key.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">Create Admin</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
